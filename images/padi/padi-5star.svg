<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="PADI 5 Star Dive Center">
  <title>PADI 5 Star Dive Center</title>
  <defs>
    <radialGradient id="g" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#E83C58"/>
      <stop offset="1" stop-color="#A50C28"/>
    </radialGradient>
  </defs>
  <circle cx="120" cy="120" r="116" fill="url(#g)"/>
  <circle cx="120" cy="120" r="116" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity=".4"/>
  <circle cx="120" cy="120" r="108" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity=".5"/>

  <!-- PADI top -->
  <text x="120" y="78" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif" font-weight="900"
        font-size="34" fill="#FFFFFF" letter-spacing="3">PADI</text>

  <!-- 5 stars -->
  <g fill="#FFFFFF" transform="translate(120 105)">
    <!-- 5 stars centered -->
    <g transform="translate(-72,0)"><path d="M0,-10 L2.94,-3.09 L10.39,-3.09 L4.45,1.18 L6.18,8.09 L0,4.0 L-6.18,8.09 L-4.45,1.18 L-10.39,-3.09 L-2.94,-3.09 Z"/></g>
    <g transform="translate(-36,0)"><path d="M0,-10 L2.94,-3.09 L10.39,-3.09 L4.45,1.18 L6.18,8.09 L0,4.0 L-6.18,8.09 L-4.45,1.18 L-10.39,-3.09 L-2.94,-3.09 Z"/></g>
    <g transform="translate(0,0)"><path d="M0,-10 L2.94,-3.09 L10.39,-3.09 L4.45,1.18 L6.18,8.09 L0,4.0 L-6.18,8.09 L-4.45,1.18 L-10.39,-3.09 L-2.94,-3.09 Z"/></g>
    <g transform="translate(36,0)"><path d="M0,-10 L2.94,-3.09 L10.39,-3.09 L4.45,1.18 L6.18,8.09 L0,4.0 L-6.18,8.09 L-4.45,1.18 L-10.39,-3.09 L-2.94,-3.09 Z"/></g>
    <g transform="translate(72,0)"><path d="M0,-10 L2.94,-3.09 L10.39,-3.09 L4.45,1.18 L6.18,8.09 L0,4.0 L-6.18,8.09 L-4.45,1.18 L-10.39,-3.09 L-2.94,-3.09 Z"/></g>
  </g>

  <!-- 5 STAR -->
  <text x="120" y="148" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif" font-weight="900"
        font-size="24" fill="#FFFFFF" letter-spacing="4">5 STAR</text>

  <!-- DIVE CENTER -->
  <text x="120" y="176" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif" font-weight="700"
        font-size="14" fill="#FFFFFF" letter-spacing="3">DIVE CENTER</text>

  <!-- AFFILIATED partner -->
  <text x="120" y="200" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif" font-weight="400"
        font-size="9" fill="#FFFFFF" fill-opacity=".75" letter-spacing="2">PARTENAIRE AFFILIÉ</text>
</svg>
